name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements.test.in

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app/ tests/

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app/

      - name: Unit tests
        working-directory: backend
        run: pytest tests/unit -v --tb=short

  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

  sdk-python:
    name: Python SDK (test)
    runs-on: ubuntu-latest
    if: hashFiles('sdk/pyproject.toml') != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        working-directory: sdk
        run: |
          pip install -e .
          pip install pytest pytest-asyncio respx httpx

      - name: Unit tests
        working-directory: sdk
        run: pytest tests/ -v --tb=short

  sdk-js:
    name: TypeScript SDK (test)
    runs-on: ubuntu-latest
    if: hashFiles('sdk-js/package.json') != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json

      - name: Install dependencies
        working-directory: sdk-js
        run: npm ci

      - name: Unit tests
        working-directory: sdk-js
        run: npm test

  sdk-vercel-ai:
    name: Vercel AI SDK tools (test)
    runs-on: ubuntu-latest
    if: hashFiles('sdk-vercel-ai/package.json') != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk-vercel-ai/package-lock.json

      - name: Install dependencies
        working-directory: sdk-vercel-ai
        run: npm ci

      - name: Unit tests
        working-directory: sdk-vercel-ai
        run: npm test

  mcp-server:
    name: MCP server (test)
    runs-on: ubuntu-latest
    if: hashFiles('mcp-server/package.json') != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Unit tests
        working-directory: mcp-server
        run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend, sdk-python, sdk-js, sdk-vercel-ai, mcp-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t letagentpay-backend backend/

      - name: Copy spec docs for frontend build
        run: |
          mkdir -p frontend/public/asps
          cp docs/agent_spending_policy_spec.md frontend/public/asps/v1-spec.md
          cp docs/mission_policy_spec.md frontend/public/asps/v2-spec.md

      - name: Build frontend image
        run: docker build -t letagentpay-frontend frontend/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [backend, frontend, sdk-python, sdk-js, sdk-vercel-ai, mcp-server]
    if: "github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'release: v\K[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from commit message"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        run: |
          NOTES=$(awk '/^## \['"${{ steps.version.outputs.version }}"'\]/{found=1; next} /^## \[/{if(found) exit} found{print}' docs/CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "$RELEASE_NOTES"
